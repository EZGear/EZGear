name: Desktop Pet (Windows .exe)

on:
  push:
    paths:
      - "desktop-pet/**"
      - ".github/workflows/desktop-pet.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        working-directory: desktop-pet
        run: |
          python -m pip install pillow pyinstaller
          python -m PyInstaller --noconfirm --onefile --windowed --name DesktopPet desktop_pet.py
          Copy-Item settings.json dist/
          Copy-Item -Recurse img dist/img
      - uses: actions/upload-artifact@v4
        with:
          name: DesktopPet-windows
          path: desktop-pet/dist/
